name: Refresh contribution stats

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate contribution card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=f1amee-dev&include_all_commits=true&show_icons=false&show=contributions&hide=stars,issues,commits&rank_icon=github&number_format=long&theme=github_dark&hide_border=true&disable_animations=true&custom_title=GitHub%20contributions
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'
      - name: Commit updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution stats'
            git push
          fi
